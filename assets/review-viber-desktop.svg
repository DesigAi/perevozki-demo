<svg xmlns="http://www.w3.org/2000/svg" width="300" height="370" viewBox="0 0 300 370">
  <rect width="300" height="370" rx="8" fill="#e5d9f1"/>
  <path d="M0 8a8 8 0 0 1 8-8h284a8 8 0 0 1 8 8v42H0z" fill="#7653a2"/>
  <circle cx="28" cy="25" r="16" fill="#e8dcf4"/><text x="28" y="30" text-anchor="middle" fill="#684195" font-family="Arial,sans-serif" font-size="15" font-weight="700">В</text>
  <text x="53" y="22" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Офисный переезд</text><text x="53" y="38" fill="#f0e5fb" font-family="Arial,sans-serif" font-size="10">переписка</text>
  <rect x="14" y="69" width="272" height="108" rx="11" fill="#fff"/>
  <text x="27" y="91" fill="#332b3b" font-family="Arial,sans-serif" font-size="13"><tspan x="27">Спасибо за помощь с офисом.</tspan><tspan x="27" dy="18">Технику упаковали аккуратно,</tspan><tspan x="27" dy="18">коробки привезли в нужном</tspan><tspan x="27" dy="18">порядке. Работу не задержали.</tspan></text>
  <rect x="57" y="192" width="229" height="69" rx="11" fill="#d1b8ed"/>
  <text x="70" y="215" fill="#332b3b" font-family="Arial,sans-serif" font-size="13"><tspan x="70">Спасибо, что поделились!</tspan><tspan x="70" dy="18">Рады, что переезд прошёл</tspan><tspan x="70" dy="18">удобно для вашей команды.</tspan></text>
  <rect x="14" y="277" width="272" height="72" rx="11" fill="#fff"/>
  <text x="27" y="301" fill="#332b3b" font-family="Arial,sans-serif" font-size="13"><tspan x="27">Порекомендуем вас коллегам,</tspan><tspan x="27" dy="18">если понадобится переезд.</tspan></text>
</svg>
