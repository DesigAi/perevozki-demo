<svg xmlns="http://www.w3.org/2000/svg" width="300" height="370" viewBox="0 0 300 370">
  <rect width="300" height="370" rx="8" fill="#d4e6f2"/>
  <path d="M0 8a8 8 0 0 1 8-8h284a8 8 0 0 1 8 8v42H0z" fill="#3185b4"/>
  <circle cx="28" cy="25" r="16" fill="#c7e8fa"/><text x="28" y="30" text-anchor="middle" fill="#217eaf" font-family="Arial,sans-serif" font-size="15" font-weight="700">П</text>
  <text x="53" y="22" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Перевозка мебели</text><text x="53" y="38" fill="#def1fa" font-family="Arial,sans-serif" font-size="10">переписка</text>
  <rect x="14" y="69" width="272" height="108" rx="11" fill="#fff"/>
  <text x="27" y="91" fill="#253741" font-family="Arial,sans-serif" font-size="13"><tspan x="27">Заказывали машину и двух</tspan><tspan x="27" dy="18">грузчиков. Всё согласовали</tspan><tspan x="27" dy="18">заранее, мебель перевезли</tspan><tspan x="27" dy="18">аккуратно и без суеты.</tspan></text>
  <rect x="62" y="192" width="224" height="69" rx="11" fill="#b8dcf4"/>
  <text x="75" y="215" fill="#253741" font-family="Arial,sans-serif" font-size="13"><tspan x="75">Благодарим за отзыв!</tspan><tspan x="75" dy="18">Хорошо, что смогли</tspan><tspan x="75" dy="18">помочь с перевозкой.</tspan></text>
  <rect x="14" y="277" width="272" height="72" rx="11" fill="#fff"/>
  <text x="27" y="301" fill="#253741" font-family="Arial,sans-serif" font-size="13"><tspan x="27">И по стоимости всё получилось</tspan><tspan x="27" dy="18">так, как договорились.</tspan></text>
</svg>
