<svg xmlns="http://www.w3.org/2000/svg" width="300" height="370" viewBox="0 0 300 370"><rect x="0" y="0" width="300" height="370" rx="8" fill="#fffaf2"/><rect x="0" y="0" width="300" height="54" rx="0" fill="#eadbc5"/><text x="17" y="24" fill="#413526" font-family="Arial,sans-serif" font-size="13" font-weight="700"><tspan x="17">Email · Office move</tspan></text><text x="17" y="43" fill="#6c604e" font-family="Arial,sans-serif" font-size="10" font-weight="400"><tspan x="17">DEMO · Sample customer email</tspan></text><text x="17" y="80" fill="#413526" font-family="Arial,sans-serif" font-size="13" font-weight="700"><tspan x="17">Subject: A smooth office move</tspan></text><text x="17" y="113" fill="#413526" font-family="Arial,sans-serif" font-size="13" font-weight="400"><tspan x="17">Hi team,</tspan><tspan x="17" dy="19">Just a quick thank-you. The</tspan><tspan x="17" dy="19">labelled boxes made unpacking</tspan><tspan x="17" dy="19">so much easier, and the desks</tspan><tspan x="17" dy="19">were set out exactly as planned.</tspan><tspan x="17" dy="19"></tspan><tspan x="17" dy="19">We were back to work on Monday</tspan><tspan x="17" dy="19">without hunting for equipment.</tspan><tspan x="17" dy="19"></tspan><tspan x="17" dy="19">Best wishes,</tspan><tspan x="17" dy="19">Sarah</tspan></text><text x="17" y="352" fill="#80715d" font-family="Arial,sans-serif" font-size="10" font-weight="400"><tspan x="17">Illustrative email, not a real review</tspan></text></svg>
