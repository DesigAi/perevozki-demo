<svg xmlns="http://www.w3.org/2000/svg" width="300" height="370" viewBox="0 0 300 370"><rect x="0" y="0" width="300" height="370" rx="8" fill="#f0edf7"/><rect x="0" y="0" width="300" height="54" rx="0" fill="#ded7ee"/><text x="17" y="24" fill="#43385a" font-family="Arial,sans-serif" font-size="13" font-weight="700"><tspan x="17">Jess · Student move</tspan></text><text x="17" y="43" fill="#756a88" font-family="Arial,sans-serif" font-size="10" font-weight="400"><tspan x="17">SMS</tspan></text><rect x="14" y="73" width="269" height="109" rx="11" fill="#fff"/><text x="26" y="98" fill="#43385a" font-family="Arial,sans-serif" font-size="13" font-weight="400"><tspan x="26">All moved in, thank you!</tspan><tspan x="26" dy="19">You made moving out of halls</tspan><tspan x="26" dy="19">really easy. I thought the boxes</tspan><tspan x="26" dy="19">would take me all afternoon 😅</tspan></text><rect x="45" y="202" width="241" height="90" rx="11" fill="#7258a5"/><text x="57" y="226" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="400"><tspan x="57">Great to hear you’re settled.</tspan><tspan x="57" dy="19">Good luck with the new term!</tspan><tspan x="57" dy="19">Let us know if you need us again.</tspan></text><rect x="14" y="310" width="177" height="25" rx="8" fill="#fff"/><text x="25" y="327" fill="#43385a" font-family="Arial,sans-serif" font-size="12" font-weight="400"><tspan x="25">Already told my flatmates!</tspan></text></svg>
