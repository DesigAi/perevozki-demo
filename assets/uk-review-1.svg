<svg xmlns="http://www.w3.org/2000/svg" width="300" height="370" viewBox="0 0 300 370"><rect x="0" y="0" width="300" height="370" rx="8" fill="#e4eee5"/><rect x="0" y="0" width="300" height="53" rx="0" fill="#075e54"/><text x="18" y="23" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700"><tspan x="18">Claire · Flat move</tspan></text><text x="18" y="42" fill="#d9f1e5" font-family="Arial,sans-serif" font-size="10" font-weight="400"><tspan x="18">WhatsApp · Demo conversation</tspan></text><rect x="14" y="70" width="272" height="128" rx="11" fill="#fff"/><text x="26" y="94" fill="#24352d" font-family="Arial,sans-serif" font-size="13" font-weight="400"><tspan x="26">Thank you for yesterday! The</tspan><tspan x="26" dy="19">third-floor stairs were awkward,</tspan><tspan x="26" dy="19">but you got the sofa up safely.</tspan><tspan x="26" dy="19">Everything is in the right rooms.</tspan><tspan x="26" dy="19">Such a relief after a long day.</tspan></text><rect x="48" y="217" width="238" height="89" rx="11" fill="#c6e9b8"/><text x="60" y="242" fill="#24352d" font-family="Arial,sans-serif" font-size="13" font-weight="400"><tspan x="60">Glad we could help, Claire.</tspan><tspan x="60" dy="19">Enjoy settling into your new flat!</tspan><tspan x="60" dy="19">Thanks for choosing us.</tspan></text><text x="17" y="352" fill="#687078" font-family="Arial,sans-serif" font-size="10" font-weight="400"><tspan x="17">Illustrative conversation, not a real review</tspan></text></svg>
